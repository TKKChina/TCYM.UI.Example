<!doctype html>
<html lang="zh-CN" data-page="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="tcym-demo-document" content="__TCYM_DEMO_DOCUMENT__">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <title>TCYM.UI 离线首页</title>
  <style>
    * { box-sizing: border-box; }
    body { width:100%; height:100%;  margin: 0; padding: 24px; background: #f3f7ff; color: #172b4d; font: 14px/1.65 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 8px 0; }
    .tag { display: inline-block; padding: 2px 9px; background: #dbeafe; color: #1d4ed8; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    button { display: inline-block; border: 1px solid #b8c9e4; padding: 8px 12px; background: #fff; color: #234b82; font: inherit; cursor: pointer; }
    pre { padding: 12px; background: #fff; border: 1px solid #d6e1f0; white-space: pre-wrap; overflow-wrap: anywhere; }
    code { font-family: Consolas, monospace; }
    .input-test { margin: 16px 0; padding: 12px; border: 1px solid #d6e1f0; background: #fff; }
    .input-test label { display: block; margin: 8px 0 4px; }
    .input-test input, .input-test textarea { width: 100%; border: 1px solid #b8c9e4; padding: 8px; font: inherit; color: inherit; background: #fff; }
    .input-test textarea { min-height: 76px; resize: vertical; }
    .input-state { color: #52627d; }
  </style>
</head>
<body>
  <span class="tag">内嵌 HTML · 无网络资源</span>
  <h1>TCYM.UI 离线首页</h1>
  <p>此页面从 Example 程序集直接加载，无需 HTML 磁盘文件。可切换内嵌页面，或在上方输入网址打开在线网页。</p>
  <section class="input-test" aria-label="原生中文输入测试">
    <label for="native-ime-input">网页原生输入框</label>
    <input id="native-ime-input" type="text" autocomplete="off" placeholder="点击后用系统输入法输入中文">
    <label for="native-ime-textarea">网页原生多行输入</label>
    <textarea id="native-ime-textarea" placeholder="可测试中文组合输入、换行、选择和复制"></textarea>
    <p id="native-ime-state" class="input-state" aria-live="polite">请使用系统输入法；此处不通过宿主脚本写入文字。</p>
  </section>
  <div class="actions">
    <button id="offline-link" type="button">前往内嵌第二页</button>
    <button id="send-string" type="button">向宿主发送字符串</button>
    <button id="send-json" type="button">向宿主发送 JSON</button>
  </div>
  <p>宿主最近发送的消息：</p>
  <pre id="host-message">等待宿主消息</pre>
  <p>页面标识：<code>home</code>；收到的消息也会回传宿主日志。</p>
  <script>
    // 只观察浏览器自己的组合/输入事件，输入值由系统 IME 和 WebKit/WebView2 原生处理。
    for (const field of document.querySelectorAll('.input-test input, .input-test textarea')) {
      field.addEventListener('compositionstart', () => {
        document.getElementById('native-ime-state').textContent = '系统输入法正在组合文字…';
      });
      field.addEventListener('input', event => {
        document.getElementById('native-ime-state').textContent = event.isComposing ? '系统输入法正在组合文字…' : '已输入：' + field.value;
      });
      field.addEventListener('compositionend', () => {
        document.getElementById('native-ime-state').textContent = '组合完成：' + field.value;
      });
    }
    // 只使用 WebView2 原生字符串 / JSON 消息，不注入 .NET 对象或使用动态反射。
    (() => {
      const page = document.documentElement.dataset.page;
      let count = 0;
      const bridge = window.chrome && window.chrome.webview;
      if (!bridge) {
        document.getElementById('host-message').textContent = '当前环境未提供网页消息通道';
        return;
      }
      // 内嵌文档没有 file URL；切页由宿主读取另一份固定资源后直接加载。
      document.getElementById('offline-link').addEventListener('click', () => bridge.postMessage({type: 'demo-navigate', page: 'next'}));
      document.getElementById('send-string').addEventListener('click', () => bridge.postMessage('网页字符串：' + page));
      document.getElementById('send-json').addEventListener('click', () => bridge.postMessage({type: 'page-json', page, count: ++count}));
      bridge.addEventListener('message', event => {
        window.lastHostMessage = event.data;
        document.getElementById('host-message').textContent = JSON.stringify(event.data, null, 2);
        bridge.postMessage({type: 'host-ack', page, received: event.data});
      });
      bridge.postMessage({type: 'ready', page});
    })();
  </script>
</body>
</html>
